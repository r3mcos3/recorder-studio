name: Upstream watch

# Weekly check of the Home Assistant pull requests that will change how Recorder Studio has to work.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/upstream_watch.sh
        env:
          GH_TOKEN: ${{ github.token }}
